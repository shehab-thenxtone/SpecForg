<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Azure DevOps Blue Gradient -->
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Claude AI Anthropic Glow -->
    <radialGradient id="claudeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Orange Gradient for Claude/Forge elements -->
    <linearGradient id="forgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Test Case Green Success Gradient -->
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <!-- Glow Filter for Interactive Elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Tech Ring (Extension Frame) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="16 12"/>

  <!-- AI Processing Glow Layer -->
  <circle cx="256" cy="230" r="140" fill="url(#claudeGlow)" filter="url(#glow)"/>

  <!-- DATA FLOW ARROWS (Looping Pipeline) -->
  <!-- Left to Center: ADO to AI -->
  <path d="M 155 240 C 190 200, 210 200, 230 215" fill="none" stroke="url(#azureGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 15" stroke-dashoffset="5"/>
  <!-- Center to Right: AI to Test Cases -->
  <path d="M 282 215 C 300 200, 320 200, 355 240" fill="none" stroke="url(#forgeGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 15" stroke-dashoffset="5"/>
  <!-- Bottom Return: Test Cases back to ADO -->
  <path d="M 340 370 C 256 420, 256 420, 172 370" fill="none" stroke="url(#successGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 8"/>
  <polygon points="175,365 160,370 170,382" fill="#10B981"/>

  <!-- NODE 1: Azure DevOps Source (Left) -->
  <g transform="translate(90, 220)">
    <!-- ADO Infinity-Style Geometry Minimalist Interpretion -->
    <path d="M -15 -25 L 30 5 L 5 30 L -40 0 Z" fill="url(#azureGrad)"/>
    <path d="M 5 30 L 30 5 L 45 20 L 15 45 Z" fill="#00BCF2" opacity="0.9"/>
    <circle cx="5" cy="5" r="4" fill="#FFFFFF"/>
  </g>

  <!-- NODE 2: Claude AI Core / The Forge (Center Top) -->
  <g transform="translate(256, 190)" filter="url(#glow)">
    <!-- Main Anvil / AI Crown Hub -->
    <path d="M -45 -20 L 45 -20 L 35 15 L 15 20 L 0 45 L -15 20 L -35 15 Z" fill="url(#forgeGrad)"/>
    <!-- Anthropic Claude Style Stylized Inner Facet -->
    <path d="M -20 -10 L 20 -10 L 15 10 L 0 25 L -15 10 Z" fill="#FFF" opacity="0.2"/>
    <!-- Spark / Generation Dots -->
    <circle cx="0" cy="-35" r="6" fill="#FBBF24"/>
    <circle cx="-55" cy="-5" r="4" fill="#FBBF24"/>
    <circle cx="55" cy="-5" r="4" fill="#FBBF24"/>
  </g>

  <!-- NODE 3: Generated Test Cases (Right) -->
  <g transform="translate(362, 220)">
    <!-- Clipboard / Document Matrix -->
    <rect x="-25" y="-30" width="50" height="60" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
    <rect x="-25" y="-30" width="50" height="60" rx="6" fill="none" stroke="url(#successGrad)" stroke-width="2"/>
    <!-- Checkmarks & Lines -->
    <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="2" x2="12" y2="2" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M -12 16 L -8 20 L 2 10" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CENTRAL FORGE BRANDING (SpecForg Text) -->
  <text x="256" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="1.5">
    Spec<tspan fill="#F59E0B">Forg</tspan>
  </text>
  
  <!-- Subtle Extension Identifier Icon (Puzzle Piece Concept Overlay) -->
  <path d="M 246 110 C 246 100, 251 95, 256 95 C 261 95, 266 100, 266 110 L 274 110 L 274 125 L 256 125 L 238 125 L 238 110 Z" fill="#64748B" opacity="0.4"/>
</svg>
